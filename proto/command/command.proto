syntax = "proto3";
package command;

import "common/entity.proto";

// 登录请求
message C2LLoginRequest {
    string account = 1;      // 账号
    string password = 2;     // 密码
    string device_id = 3;    // 设备ID
    string platform = 4;     // 平台标识
    string version = 5;      // 客户端版本
}

// 登录响应
message S2LLoginResponse {
    int32 code = 1;         // 错误码
    string message = 2;     // 错误信息
    string token = 3;       // JWT令牌
    string ws_addr = 4;     // WebSocket地址
    int32 ws_port = 5;      // WebSocket端口
}

// 心跳请求
message C2GHeartbeatRequest {
    int64 timestamp = 1;    // 时间戳
    string token = 2;       // JWT令牌,用于身份验证
}

// 心跳响应
message G2CHeartbeatResponse {
    int64 timestamp = 1;    // 服务器时间戳
    int32 code = 2;        // 状态码
}

// 获取用户信息请求
message C2GUserInfoRequest {
    string token = 1;       // JWT令牌
}

// 获取用户信息响应
message G2CUserInfoResponse {
    int32 code = 1;        // 错误码
    string message = 2;    // 错误信息
    common.UserInfo user = 3;  // 用户信息
    bool is_new = 4;       // 是否是新创建的用户
}

// 获取用户卡包请求
message C2GUserCardBagRequest {
    string token = 1;       // JWT令牌
}

// 获取用户卡包响应
message G2CUserCardBagResponse {
    int32 code = 1;        // 错误码
    string message = 2;    // 错误信息
    repeated common.CardInfo cards = 3;  // 卡牌列表
}

// 获取背包信息请求
message C2GBagInfoRequest {
    string token = 1;
}

// 背包信息响应
message G2CBagInfoResponse {
    int32 code = 1;
    string message = 2;
    repeated common.ItemInfo items = 3;  // 背包物品列表
}

// 使用物品请求
message C2GUseItemRequest {
    string token = 1;        // 用户令牌
    int32 item_id = 2;      // 物品ID
    int32 count = 3;        // 使用数量
}

// 使用物品响应
message G2CUseItemResponse {
    repeated common.ItemInfo items = 1;  // 变化的物品列表
}