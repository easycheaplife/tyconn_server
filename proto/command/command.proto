syntax = "proto3";
package command;

import "common/user.proto";

// 登录请求
message C2SLoginRequest {
    string account = 1;      // 账号
    string password = 2;     // 密码
    string device_id = 3;    // 设备ID
    string platform = 4;     // 平台
    string version = 5;      // 客户端版本
}

// 登录响应
message S2CLoginResponse {
    int32 code = 1;         // 错误码
    string message = 2;     // 错误信息
    string token = 3;       // 登录令牌
    common.UserInfo user_info = 4;  // 用户信息
}

// 注册请求
message C2SRegisterRequest {
    string username = 1;    // 用户名
    string password = 2;    // 密码
    string nickname = 3;    // 昵称
    string avatar = 4;      // 头像URL，可选
}

// 注册响应
message S2CRegisterResponse {
    int32 code = 1;            // 错误码
    string message = 2;        // 错误信息
    common.UserInfo user_info = 3;  // 用户信息
}

