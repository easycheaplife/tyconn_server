syntax = "proto3";
package command;

import "common/entity.proto";
import "common/enum.proto";

// 登录请求 {{Req:1}}
message C2LLoginRequest {
    string account = 1;      // 账号
    string password = 2;     // 密码
    string device_id = 3;    // 设备ID
    string platform = 4;     // 平台标识
    string version = 5;      // 客户端版本
}

// 登录响应 {{Res:2}}
message L2CLoginResponse {
    string token = 1;       // JWT令牌
    string ws_addr = 2;     // WebSocket地址
    int32 ws_port = 3;      // WebSocket端口
}

// 心跳请求 {{Req:3}}
message C2GHeartbeatRequest {
    int64 timestamp = 1;    // 时间戳
    string token = 2;       // JWT令牌,用于身份验证
}

// 心跳响应 {{Res:4}}
message G2CHeartbeatResponse {
    int64 timestamp = 1;    // 服务器时间戳
}

// 获取用户信息请求 {{Req:5}}
message C2GUserInfoRequest {
    string token = 1;       // JWT令牌
}

// 获取用户信息响应 {{Res:6}}
message G2CUserInfoResponse {
    common.UserInfo user = 1;  // 用户信息
    bool is_new = 2;       // 是否是新创建的用户
}

// 获取用户卡牌请求 {{Req:7}}
message C2GUserCardsRequest {
    string token = 1;       // JWT令牌
}

// 获取用户卡牌响应 {{Res:8}}
message G2CUserCardsResponse {
    repeated common.CardInfo cards = 1;  // 卡牌列表
}

// 获取背包信息请求 {{Req:9}}
message C2GBagInfoRequest {
    string token = 1;
}

// 背包信息响应 {{Res:10}}
message G2CBagInfoResponse {
    repeated common.ItemInfo items = 1;  // 背包物品列表
}

// 使用物品请求 {{Req:11}}
message C2GUseItemRequest {
    string token = 1;        // 用户令牌
    int32 item_id = 2;      // 物品ID
    int32 count = 3;        // 使用数量
}

// 使用物品响应 {{Res:12}}
message G2CUseItemResponse {
    repeated common.ItemInfo items = 1;  // 变化的物品列表
}

// 扩展背包请求 {{Req:13}}
message C2GExpandBagRequest {
    string token = 1;
    common.BagType bag_type = 2;  // 使用枚举类型
    int32 add_size = 3;
}

// 扩展背包响应 {{Res:14}}
message G2CExpandBagResponse {
    int32 code = 1;               // 错误码
    string message = 2;           // 错误信息
    common.BagType bag_type = 3;  // 背包类型
    int32 new_size = 4;          // 新的背包大小
    repeated common.ItemInfo items = 5;  // 物品列表
}

// 整理背包请求 {{Req:15}}  
message C2GSortBagRequest {
    required string token = 1;       // JWT令牌
    required common.BagType bag_type = 2;   // 背包类型
    required int32 sort_rule = 3;    // 整理规则(1:类型 2:品质 3:等级)
}

// 整理背包响应 {{Res:16}}  
message G2CSortBagResponse {
    int32 code = 1;         // 错误码
    string message = 2;     // 错误信息
    repeated common.ItemInfo items = 3;     // 整理后的物品列表
}

// 物品移动请求 {{Req:17}}
message C2GMoveItemRequest {
    string token = 1;       // JWT令牌
    common.BagType from_bag = 2;   // 源背包
    int32 from_slot = 3;    // 源格子
    common.BagType to_bag = 4;     // 目标背包
    int32 to_slot = 5;      // 目标格子
    int32 count = 6;        // 移动数量(不填则全部)
}

// 物品移动响应 {{Res:18}}
message G2CMoveItemResponse {
    int32 code = 1;         // 错误码
    string message = 2;     // 错误信息
    repeated common.ItemInfo changed_items = 3;  // 变化的物品
}

// 物品合成请求 {{Req:19}}
message C2GComposeItemRequest {
    string token = 1;       // JWT令牌
    int32 target_id = 2;    // 目标物品ID
    repeated int32 material_slots = 3;  // 材料所在格子
}

// 物品合成响应 {{Res:20}}
message G2CComposeItemResponse {
    int32 code = 1;         // 错误码
    string message = 2;     // 错误信息
    bool success = 3;       // 是否成功
    common.ItemInfo new_item = 4;  // 合成的新物品
    repeated common.ItemInfo remain_items = 5;  // 剩余材料
}

// 物品分解请求 {{Req:21}}
message C2GDecomposeItemRequest {
    string token = 1;       // JWT令牌
    repeated int32 item_slots = 2;   // 要分解的物品格子
}

// 物品分解响应 {{Res:22}}
message G2CDecomposeItemResponse {
    int32 code = 1;         // 错误码
    string message = 2;     // 错误信息
    repeated common.ItemInfo result_items = 3;  // 分解获得的物品
}
