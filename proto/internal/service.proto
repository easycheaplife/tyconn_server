syntax = "proto3";
package internal;

// 服务状态同步
message ServiceStatus {
    string node_name = 1;     // 节点名称
    string service_type = 2;  // 服务类型(gate/game/etc)
    string host = 3;         // 服务地址
    int32 port = 4;         // 服务端口
    int32 client_count = 5;  // 当前连接数
    int64 timestamp = 6;    // 同步时间戳
    map<string, string> extra = 7;  // 额外信息
} 