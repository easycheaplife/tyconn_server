syntax = "proto3";
package common;

// 用户信息
message UserInfo {
    int64 user_id = 1;      // 用户ID
    string username = 2;     // 用户名
    int32 level = 3;        // 等级
    int64 exp = 4;          // 经验值
    int64 gold = 5;         // 金币
    int32 vip_level = 6;    // VIP等级
    int32 hp = 7;           // 生命值
    int32 attack = 8;       // 攻击力
    int32 defense = 9;     // 防御力
    int64 create_time = 10;  // 创建时间
    int64 login_time = 11;   // 最后登录时间
}

// 卡牌信息
message CardInfo {
    int64 card_id = 1;      // 卡牌ID
    int32 card_type = 2;    // 卡牌类型
    int32 level = 3;        // 等级
    int64 exp = 4;          // 经验值
    int32 quality = 5;      // 品质
    int32 star = 6;         // 星级
    int64 create_time = 7;  // 获得时间
    int32 power = 8;        // 战力
}

// 物品信息
message ItemInfo {
    int32 item_id = 1;
    int32 count = 2;
    int32 slot = 3;  
    int32 item_type = 4; 
}

// 背包信息
message BagInfo {
    int32 bag_type = 1;
    int32 size = 2;
    repeated ItemInfo items = 3;
}

// 邮件信息
message MailInfo {
    int64 id = 1;              // 邮件ID
    string title = 2;          // 标题
    string content = 3;        // 内容
    repeated ItemInfo items = 4;  // 附件物品
    int32 mail_type = 5;       // 邮件类型
    int32 status = 6;          // 邮件状态
    int64 create_time = 7;     // 创建时间
    int64 expire_time = 8;     // 过期时间
    int64 template_id = 9;    // 模板ID
    int64 sender_id = 10;      // 发送者ID
    string sender_name = 11;   // 发送者名称
}

// 邮件模板信息
message MailTemplateInfo {
    int64 id = 1;             // 模板ID
    string title = 2;          // 标题
    string content = 3;        // 内容
    repeated ItemInfo items = 4;  // 附件物品
    int32 mail_type = 5;       // 邮件类型
    int64 create_time = 6;     // 创建时间
    int64 expire_time = 7;     // 过期时间
}

// 用户资源信息
message ResourceInfo {
    int32 type = 1;           // 资源类型
    int32 amount = 2;         // 资源数量
}