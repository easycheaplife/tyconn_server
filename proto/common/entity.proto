syntax = "proto3";
package common;

// 用户信息
message UserInfo {
    int64 user_id = 1;      // 用户ID
    string username = 2;     // 用户名
    int32 level = 3;        // 等级
    int64 exp = 4;          // 经验值
    int64 gold = 5;         // 金币
    int32 vip_level = 6;    // VIP等级
    int32 hp = 7;           // 生命值
    int32 attack = 8;       // 攻击力
    int32 defense = 9;     // 防御力
    int64 create_time = 10;  // 创建时间
    int64 login_time = 11;   // 最后登录时间
}

// 卡牌信息
message CardInfo {
    int64 card_id = 1;      // 卡牌ID
    int32 card_type = 2;    // 卡牌类型
    int32 level = 3;        // 等级
    int64 exp = 4;          // 经验值
    int32 quality = 5;      // 品质
    int32 star = 6;         // 星级
    int64 create_time = 7;  // 获得时间
    int32 power = 8;        // 战力
}

// 物品信息
message ItemInfo {
    int32 item_id = 1;
    int32 count = 2;
    int32 slot = 3;  
    int32 item_type = 4; 
}

// 背包信息
message BagInfo {
    int32 bag_type = 1;
    int32 size = 2;
    repeated ItemInfo items = 3;
}