syntax = "proto3";
package common;

// 消息ID定义
enum MessageID {
    NONE = 0;
    C2L_LOGIN_REQUEST = 1;     // 客户端到登录服务器的登录请求
    L2C_LOGIN_RESPONSE = 2;    // 登录服务器到客户端的登录响应
    C2G_HEARTBEAT_REQUEST = 3;         // 客户端到游戏服务器的心跳请求
    G2C_HEARTBEAT_RESPONSE = 4;         // 游戏服务器到客户端的心跳响应
    C2G_USER_INFO_REQUEST = 5;  // 获取用户信息请求
    G2C_USER_INFO_RESPONSE = 6; // 获取用户信息响应
    C2G_USER_CARDS_REQUEST = 7;     // 获取用户卡牌请求
    G2C_USER_CARDS_RESPONSE = 8;    // 获取用户卡牌响应
    C2G_BAG_INFO_REQUEST = 9;        // 获取背包信息请求
    G2C_BAG_INFO_RESPONSE = 10;     // 获取背包信息响应
    C2G_USE_ITEM_REQUEST = 11;      // 使用物品请求
    G2C_USE_ITEM_RESPONSE = 12;     // 使用物品响应
    C2G_EXPAND_BAG_REQUEST = 13;    // 扩展背包请求
    G2C_EXPAND_BAG_RESPONSE = 14;   // 扩展背包响应
    C2G_SORT_BAG_REQUEST = 15;      // 整理背包请求
    G2C_SORT_BAG_RESPONSE = 16;     // 整理背包响应
    C2G_MOVE_ITEM_REQUEST = 17;     // 移动物品请求
    G2C_MOVE_ITEM_RESPONSE = 18;    // 移动物品响应
    C2G_COMPOSE_ITEM_REQUEST = 19;  // 物品合成请求
    G2C_COMPOSE_ITEM_RESPONSE = 20; // 物品合成响应
    C2G_DECOMPOSE_ITEM_REQUEST = 21;// 物品分解请求
    G2C_DECOMPOSE_ITEM_RESPONSE = 22;// 物品分解响应
}

// 会话信息
message Session {
    int32 messageId = 1;    // 消息ID
    int32 sequence = 2;     // 序列号
    int64 timestamp = 3;    // 时间戳
    string version = 4;     // 版本号
}

// 基础请求
message BaseRequest {
    Session session = 1;    // 会话信息
    bytes payload = 2;      // 消息内容
}

// 基础响应
message BaseResponse {
    Session session = 1;    // 会话信息
    int32 errorCode = 2;    // 错误码
    string errorMsg = 3;    // 错误信息
    bytes payload = 4;      // 消息负载
} 