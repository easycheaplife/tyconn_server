syntax = "proto3";
package login;

// 登录请求 (Client to Server)
message C2SLoginRequest {
    string account = 1;        // 账号
    string password = 2;       // 密码
    string device_id = 3;      // 设备ID
    string platform = 4;       // 平台(ios/android/web)
    string version = 5;        // 客户端版本
}

// 登录响应 (Server to Client)
message S2CLoginResponse {
    int32 code = 1;           // 状态码
    string message = 2;       // 提示消息
    UserInfo user_info = 3;   // 用户信息
    string token = 4;         // 登录令牌
}

// 用户信息
message UserInfo {
    int64 user_id = 1;        // 用户ID
    string nickname = 2;       // 昵称
    int32 level = 3;          // 等级
    int64 exp = 4;            // 经验值
    int32 vip_level = 5;      // VIP等级
    int64 gold = 6;           // 金币
    int64 diamond = 7;        // 钻石
    string avatar = 8;        // 头像URL
    int64 register_time = 9;  // 注册时间
    int64 last_login = 10;    // 上次登录时间
}

// 错误码定义
enum ErrorCode {
    ERROR_CODE_SUCCESS = 0;              // 成功
    ERROR_CODE_INVALID_ACCOUNT = 1;      // 无效账号
    ERROR_CODE_WRONG_PASSWORD = 2;       // 密码错误
    ERROR_CODE_ACCOUNT_BANNED = 3;       // 账号被封禁
    ERROR_CODE_VERSION_NOT_MATCH = 4;    // 版本不匹配
    ERROR_CODE_SYSTEM_ERROR = 5;         // 系统错误
    ERROR_CODE_ALREADY_ONLINE = 6;       // 已经在线
} 